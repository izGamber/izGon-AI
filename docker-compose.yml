version: '3.8'

services:
  # izGon AI Backend
  api:
    build: .
    container_name: izgon-ai-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    command: uvicorn app.dashboard:asgi_app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - izgon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SQLite Database (optional - za demonstraciju)
  db:
    image: sqlite:latest
    container_name: izgon-ai-db
    volumes:
      - ./data:/data
    networks:
      - izgon-network

networks:
  izgon-network:
    driver: bridge

volumes:
  data:
    driver: local
