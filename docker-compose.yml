services:
  # izGon AI Backend
  api:
    build: .
    container_name: izgon-ai-api
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    command: uvicorn app.dashboard:asgi_app --host 0.0.0.0 --port 8000 --reload

    networks:
      - izgon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



networks:
  izgon-network:
    driver: bridge

volumes:
  data:
    driver: local
